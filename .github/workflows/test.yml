name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Windows smoke test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Pester is available
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pester = Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
            Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          }
          Import-Module Pester -ErrorAction Stop

      - name: Run PowerShell smoke tests
        shell: powershell
        run: ./Tests/Test-AudioSwitcher.ps1

      - name: Build portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:RUNNER_TEMP "AudioSwitcher"
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          $files = @(
            "AudioSwitcher.ps1",
            "AudioSwitcher.Native.cs",
            "Assets",
            "Start-AudioSwitcher.bat",
            "Install-Portable.ps1",
            "Uninstall-Portable.ps1",
            "config.json",
            "Install-Autostart.ps1",
            "Uninstall-Autostart.ps1",
            "README.md",
            "README.en.md",
            "VERSION.txt",
            "LICENSE"
          )
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file -Destination $packageRoot
          }
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath "AudioSwitcher.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AudioSwitcher
          path: AudioSwitcher.zip
