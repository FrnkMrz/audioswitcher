name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (z. B. v1.2.3)"
        required: false
      release_name:
        description: "Release-Titel (optional)"
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Build release ZIP
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:RUNNER_TEMP "AudioSwitcher"
          if (Test-Path -LiteralPath $packageRoot) {
            Remove-Item -LiteralPath $packageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          $files = @(
            "AudioSwitcher.ps1",
            "AudioSwitcher.Native.cs",
            "Assets",
            "Start-AudioSwitcher.bat",
            "Install-Portable.ps1",
            "Uninstall-Portable.ps1",
            "config.json",
            "Install-Autostart.ps1",
            "Uninstall-Autostart.ps1",
            "README.md",
            "README.en.md",
            "VERSION.txt",
            "LICENSE"
          )
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file -Destination $packageRoot -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath "AudioSwitcher.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioSwitcher
          path: AudioSwitcher.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.tag_name || 'latest') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_name || 'Latest main build') }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: AudioSwitcher.zip
